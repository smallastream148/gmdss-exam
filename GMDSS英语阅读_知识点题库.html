<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--fs:1}  /* 性能优化：全局缩放变量，避开 style.zoom */
html,body{height:100%}
body{font-family:"Microsoft YaHei","Segoe UI","PingFang SC",Arial,sans-serif;background:#f0f1f3;color:#1f2328;display:flex;flex-direction:column;overflow:hidden;font-size:calc(14px * var(--fs))}

header{background:#fff;border-bottom:2px solid #2b2f36;padding:10px 18px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:calc(20px * var(--fs));letter-spacing:.5px;display:flex;align-items:center;gap:10px}
header h1 .badge{background:#2b2f36;color:#fff;font-size:calc(12px * var(--fs));padding:2px 8px;border-radius:10px;font-weight:normal}
header .ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search-box{display:flex;align-items:center;background:#f2f3f5;border:1px solid #c9ced4;border-radius:6px;padding:4px 8px;min-width:220px}
.search-box input{border:0;background:transparent;outline:none;flex:1;font-size:calc(14px * var(--fs));color:#333;padding:4px 6px;font-family:inherit}
.search-box .icon{color:#8a919a;font-size:calc(14px * var(--fs))}
.search-box input::placeholder{color:#8a919a}
.btn{border:1px solid #c9ced4;background:#eef0f2;border-radius:5px;cursor:pointer;font-size:calc(13px * var(--fs));padding:5px 12px;color:#333;font-weight:600;line-height:1.3;transition:all .15s}
.btn:hover{background:#e2e6ea;border-color:#aab3bd}
.btn:active{background:#2b2f36;color:#fff;border-color:#2b2f36}
.btn.danger{color:#b02a2a;border-color:#f3c4c4;background:#fdf1f1}
.btn.danger:hover{background:#f9d4d4;border-color:#b02a2a}

/* 导入对话框 */
#impDialog{position:fixed;z-index:200;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:2px solid #2b2f36;border-radius:8px;width:min(520px,90vw);box-shadow:0 8px 30px rgba(0,0,0,.3)}
#impDialog .id-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:2px solid #2b2f36}
#impDialog .id-head .t{font-size:16px;font-weight:700;flex:1}
#impDialog .id-head button{background:none;border:0;font-size:22px;cursor:pointer;line-height:1;color:#666}
#impDialog .id-body{padding:14px 18px;font-size:13.5px;line-height:1.7}
#impDialog .id-body .stat{background:#f7f8fa;border:1px solid #d9dce1;border-radius:6px;padding:10px 12px;margin:8px 0;font-size:13px}
#impDialog .id-body .stat b{color:#1e40af}
#impDialog .id-body .stat.overlap{background:#fff3e0;border-color:#e6c96b}
#impDialog .id-body .stat.overlap b{color:#c05621}
#impDialog .id-actions{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid #e1e4e8;background:#fafbfc;border-radius:0 0 6px 6px}
#impDialog .id-actions button{font-size:14px;padding:7px 16px;border-radius:5px;cursor:pointer;border:1px solid #c9ced4;background:#fff;color:#333}
#impDialog .id-actions button:hover{background:#eef0f2}
#impDialog .id-actions .primary{background:#2b2f36;color:#fff;border-color:#2b2f36}
#impDialog .id-actions .primary:hover{background:#1f2429}
#impDialog .id-actions .danger{color:#b02a2a;border-color:#f3c4c4}
#impDialog .id-actions .danger:hover{background:#f9d4d4;border-color:#b02a2a}
#impToast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#2b2f36;color:#fff;padding:10px 20px;border-radius:6px;font-size:14px;z-index:300;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;transition:opacity .25s;pointer-events:none}
#impToast.show{opacity:1}
.zoom-ctl{display:flex;align-items:center;gap:4px;border:1px solid #c9ced4;background:#f2f3f5;border-radius:5px;padding:2px}
.zoom-ctl button{border:0;background:transparent;cursor:pointer;font-size:calc(14px * var(--fs));padding:2px 8px;color:#333;font-weight:700}
.zoom-ctl button:hover{color:#2b2f36}
.zoom-ctl .zv{font-size:calc(12px * var(--fs));color:#57606a;min-width:38px;text-align:center;cursor:pointer;user-select:none;padding:0 2px}
.zoom-ctl .zv:hover{color:#c05621;font-weight:700}

#tabs{display:flex;gap:6px;background:#fff;border-bottom:1px solid #c9ced4;padding:0 18px;flex-shrink:0;overflow-x:auto}
#tabs button{border:0;background:transparent;color:#57606a;padding:9px 16px;font-size:calc(14px * var(--fs));cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}
#tabs button:hover{color:#2b2f36}
#tabs button.active{color:#2b2f36;border-bottom-color:#2b2f36;font-weight:700}
#tabs .cnt{background:#eef0f2;border-radius:9px;padding:1px 6px;font-size:calc(11px * var(--fs));margin-left:4px;color:#57606a;font-weight:600}
#tabs button.active .cnt{background:#2b2f36;color:#fff}


main{flex:1;display:flex;min-height:0;overflow:hidden}

/* 左侧 */
#left{width:460px;background:#fff;flex-shrink:0;display:flex;flex-direction:column;min-width:280px;max-width:72vw;transition:width .25s ease}
#left.hidden-nav{width:0;min-width:0;overflow:hidden}
#left.hidden-nav #leftBody,#left.hidden-nav #kpNavWrap{visibility:hidden}
#left .left-head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid #d9dce1;background:#fafbfc;flex-shrink:0;gap:8px}
#left .left-head .t{font-size:calc(13.5px * var(--fs));font-weight:700;color:#2b2f36;letter-spacing:.5px;flex:1}
#left .left-head .btn-mini{border:1px solid #c9ced4;background:#fff;border-radius:4px;cursor:pointer;font-size:calc(12px * var(--fs));padding:3px 9px;color:#444}
#left .left-head .btn-mini:hover{background:#eef0f2}
#left .left-head .btn-mini.on{background:#2b2f36;color:#fff;border-color:#2b2f36}
#leftBody{flex:1;overflow-y:auto;display:flex;flex-direction:column}



/* 导航区 */
#kpNavWrap{flex:1;overflow-y:auto}
#kpTree{padding:2px 0 40px}
#kpTree .ch{margin:0 0 2px}
#kpTree .ch-h{display:flex;align-items:center;justify-content:space-between;padding:7px 16px;background:#f2f3f5;cursor:pointer;border-left:3px solid #2b2f36;font-size:calc(13.5px * var(--fs));font-weight:700;color:#1f2328;user-select:none;transition:background .15s}
#kpTree .ch-h:hover{background:#e8eaed}
#kpTree .ch-h .arrow{color:#8a919a;font-size:11px;margin-right:4px;transition:transform .2s;display:inline-block}
#kpTree .ch.open .ch-h .arrow{transform:rotate(90deg)}
#kpTree .ch-h .ch-cnt{background:#d9dce1;color:#57606a;font-size:calc(11px * var(--fs));padding:1px 7px;border-radius:9px;font-weight:600}
#kpTree .ch.open .ch-h .ch-cnt{background:#2b2f36;color:#fff}
#kpTree .kp-list{display:none;background:#fafbfc;padding:3px 0}
#kpTree .ch.open .kp-list{display:block}
#kpTree .kp{padding:6px 16px 6px 34px;cursor:pointer;font-size:calc(13px * var(--fs));line-height:1.5;color:#333;border-left:3px solid transparent;display:flex;justify-content:space-between;align-items:center;gap:6px;transition:all .12s;user-select:none}
#kpTree .kp:hover{background:#eef0f2;border-left-color:#aab3bd}
#kpTree .kp.active{background:#fff8e1;border-left-color:#c05621;color:#7a5b00;font-weight:700}
#kpTree .kp .kp-name{flex:1;line-height:1.4}
#kpTree .kp .kp-cnt{background:#e1e7ec;color:#57606a;font-size:calc(11px * var(--fs));padding:0 7px;border-radius:9px;font-weight:600;flex-shrink:0}
#kpTree .kp.active .kp-cnt{background:#c05621;color:#fff}
#kpTree .ch-all{padding:7px 16px 7px 24px;cursor:pointer;font-size:calc(13.5px * var(--fs));color:#444;font-weight:600;border-left:3px solid transparent;background:#f0f7ff;display:flex;justify-content:space-between;align-items:center}
#kpTree .ch-all:hover{background:#e3eef9}
#kpTree .ch-all.active{background:#ddeeff;border-left-color:#2b6cb0;color:#1e40af;font-weight:700}
#kpTree .ch-all .kp-cnt{background:#d0e1f3;color:#1e40af;font-size:calc(11px * var(--fs));padding:0 7px;border-radius:9px;font-weight:600}
#kpTree .ch-all.active .kp-cnt{background:#1e40af;color:#fff}

/* 分栏条 */
#divider{width:6px;cursor:col-resize;background:#c9ced4;flex-shrink:0;position:relative;transition:background .15s}
#divider:hover,#divider.drag{background:#2b2f36}
#divider::after{content:"";position:absolute;left:2px;top:50%;transform:translateY(-50%);width:2px;height:34px;background:#8a919a;border-radius:1px}

/* 右侧 */
#right{flex:1;overflow-y:auto;padding:14px 22px 80px;background:#f7f8f9}
/* 虚拟列表：绝对定位 + transform 定位，避免 reflow 跳变 */
#vlViewport{position:relative;width:100%}
.q-card-wrap{position:absolute;left:0;right:0;top:0;will-change:transform;margin-bottom:0}
.q-card-wrap .q-card{margin-bottom:0}
.ch-banner{background:linear-gradient(135deg,#2b2f36,#1f2429);color:#fff;padding:16px 22px;border-radius:8px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.ch-banner h2{font-size:calc(20px * var(--fs));margin-bottom:5px}
.ch-banner .desc{font-size:calc(13.5px * var(--fs));color:#d9dce1;line-height:1.7}
.ch-banner .stats{display:flex;gap:14px;margin-top:10px;font-size:calc(13px * var(--fs));flex-wrap:wrap}
.ch-banner .stats span{background:rgba(255,255,255,.1);padding:3px 10px;border-radius:10px}

.q-card{background:#fff;border:1px solid #d9dce1;border-radius:8px;padding:14px 18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:border-color .15s}
.q-card:hover{border-color:#aab3bd}
.q-no{font-size:calc(13px * var(--fs));color:#57606a;font-weight:700;background:#eef0f2;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:6px}
.q-no .q-seq{display:inline-block;background:#c05621;color:#fff;font-weight:700;padding:1px 7px;border-radius:9px;margin-right:6px;font-size:calc(11px * var(--fs))}
.q-card .q-stem{font-size:calc(15.5px * var(--fs));line-height:1.7;color:#1f2328;margin:4px 0 8px}
.q-opts{list-style:none}
.q-opt{padding:6px 12px;font-size:calc(15px * var(--fs));line-height:1.55;color:#333;margin:3px 0;border-radius:5px;cursor:pointer;border:1px solid #e9ecef;transition:all .12s;display:flex;align-items:flex-start;gap:6px}
.q-opt:hover{background:#fafbfc;border-color:#c9ced4}
.q-opt .ol{font-weight:700;color:#57606a;min-width:22px;flex-shrink:0}
.q-opt.mark{background:#fff8e1;border-color:#d9a400;color:#5c4300;font-weight:600}
.q-opt.correct{background:#e6f4ea;border-color:#77c78f;color:#14532d;font-weight:700}
.q-opt.correct .ol::after{content:" ✓";color:#1d6f42}
.q-actions{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid #eef0f2;flex-wrap:wrap}
.q-actions .ans-bar{font-size:calc(14.5px * var(--fs));background:#e6f4ea;color:#14532d;border:1px solid #77c78f;padding:4px 12px;border-radius:5px;font-weight:600;flex:1;min-width:0;word-break:break-word}
.q-actions .ans-bar b{color:#0f3d1f;font-size:calc(15.5px * var(--fs))}
.q-actions .ans-bar.hidden{display:none}
.q-actions .act-btn{border:1px solid #c9ced4;background:#f2f3f5;padding:4px 12px;font-size:calc(12.5px * var(--fs));cursor:pointer;border-radius:4px;color:#444;transition:all .12s}
.q-actions .act-btn:hover{background:#e2e6ea;border-color:#aab3bd}
.q-actions .act-btn.on{background:#2b2f36;color:#fff;border-color:#2b2f36}
/* 教师备注面板 */
.q-notes{margin-top:10px;border:1px dashed #d9a400;border-radius:6px;background:#fffbe6;padding:10px 12px;display:none}
.q-notes.open{display:block}
.q-notes .note-label{font-size:calc(12px * var(--fs));font-weight:700;color:#7a5b00;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.q-notes textarea{width:100%;min-height:50px;border:1px solid #e6c96b;border-radius:4px;padding:6px 8px;font-size:calc(13px * var(--fs));font-family:inherit;background:#fff;color:#333;resize:vertical;box-sizing:border-box;line-height:1.55}
.q-notes textarea:focus{outline:none;border-color:#c05621;box-shadow:0 0 0 2px rgba(192,86,33,.15)}
.q-notes .save-hint{font-size:calc(11px * var(--fs));color:#8a919a;margin-top:4px;text-align:right}
.q-act-note{background:#fff8e1 !important;border-color:#d9a400 !important;color:#7a5b00 !important}
.q-act-note.has-content{background:#c05621 !important;color:#fff !important;border-color:#c05621 !important}
.q-tags{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
.q-tag{font-size:calc(11px * var(--fs));background:#eef0f2;color:#57606a;padding:1px 7px;border-radius:9px;cursor:pointer;transition:all .12s;border:1px solid transparent}
.q-tag:hover{background:#d9dce1;color:#1f2328}
.q-tag.ch{background:#ddeeff;color:#1e40af;border-color:#b6d3f5}
.q-tag.kp{background:#fff8e1;color:#7a5b00;border-color:#e6c96b}
.q-tag.kp.active{background:#c05621;color:#fff;border-color:#c05621}

.empty{text-align:center;padding:80px 20px;color:#8a919a}
.empty h3{font-size:calc(18px * var(--fs));color:#57606a;margin-bottom:8px}
.empty p{font-size:calc(14px * var(--fs));line-height:1.7}

.hidden{display:none !important}
mark{background:#fff8e1;color:#7a5b00;padding:0 2px;border-radius:2px}

#left::-webkit-scrollbar,#right::-webkit-scrollbar,#leftBody::-webkit-scrollbar{width:10px;height:10px}
#left::-webkit-scrollbar-track,#right::-webkit-scrollbar-track,#leftBody::-webkit-scrollbar-track{background:#f0f1f3}
#left::-webkit-scrollbar-thumb,#right::-webkit-scrollbar-thumb,#leftBody::-webkit-scrollbar-thumb{background:#c9ced4;border-radius:5px}
#left::-webkit-scrollbar-thumb:hover,#right::-webkit-scrollbar-thumb:hover,#leftBody::-webkit-scrollbar-thumb:hover{background:#aab3bd}

#backTop{position:fixed;bottom:24px;right:24px;z-index:90;width:42px;height:42px;border-radius:50%;border:0;background:#2b2f36;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:all .2s}
#backTop:hover{background:#1f2429;transform:translateY(-2px)}

@media (max-width:900px){
  #left{width:340px}
  #right{padding:12px 14px}
}

/* ===========================================
   📱 移动端响应式优化 (≤768px)
   =========================================== */
@media (max-width: 768px) {
  /* ----- 顶部 Header ----- */
  header {
    padding: 8px 12px !important;
    gap: 8px;
  }
  header h1 {
    font-size: 15px !important;
    letter-spacing: 0.5px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  header h1 .badge {
    font-size: 10px !important;
    padding: 2px 6px;
    flex-shrink: 0;
    margin-left: 4px;
  }

  /* ----- flex 排序：h1[1]  按钮[2]  控件[3] 换行 ----- */
  header h1 { order: 1; flex: 1; min-width: 0; }
  #btnNavToggle {
    display: inline-flex !important;
    align-items: center;
    order: 2;
    flex-shrink: 0;
    padding: 3px 9px !important;
    font-size: 12px !important;
  }
  header .ctrl { order: 3; width: 100%; }

  /* ----- 控件区：换行 + 减少 min-width ----- */
  header .ctrl {
    width: 100%;
    gap: 6px;
  }
  .search-box {
    min-width: 0 !important;
    flex: 1;
    padding: 3px 6px;
  }
  .search-box input { font-size: 13px !important; padding: 3px 4px; }

  /* ----- 隐藏次要控件 ----- */
  #btnExport, #btnImport { display: none !important; }
  .btn {
    padding: 4px 9px !important;
    font-size: 12px !important;
  }

  /* ----- 缩放控件 ----- */
  .zoom-ctl button {
    padding: 2px 7px !important;
    font-size: 13px !important;
  }
  .zoom-ctl .zv { font-size: 11px !important; min-width: 32px !important; }

  /* ----- 📂 导航切换按钮（仅移动端显示） ----- */
  #btnNavToggle { display: inline-block !important; }

  /* ----- Tabs ----- */
  #tabs {
    padding: 0 12px !important;
    gap: 4px;
  }
  #tabs button {
    padding: 7px 12px !important;
    font-size: 13px !important;
  }
  #tabs .cnt {
    font-size: 10px !important;
    padding: 0 5px !important;
  }

  /* ----- 左侧：默认折叠为抽屉 ----- */
  main { position: relative !important; }
  #left {
    position: absolute !important;
    left: 0; top: 0;
    height: 100%;
    z-index: 50;
    box-shadow: 4px 0 16px rgba(0,0,0,0.2);
    max-width: 85vw !important;
  }
  #left.hidden-nav {
    width: 0 !important;
  }
  /* 抽屉打开时遮罩 */
  body.nav-open::after {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 40;
  }

  /* ----- 主内容紧凑 ----- */
  main { flex: 1; min-height: 0; }
  #right {
    padding: 10px 12px 80px !important;
  }

  /* ----- 章节横幅 ----- */
  .ch-banner {
    padding: 12px 14px !important;
    border-radius: 6px !important;
    margin-bottom: 10px !important;
  }
  .ch-banner h2 { font-size: 16px !important; }
  .ch-banner .desc { font-size: 12.5px !important; line-height: 1.5 !important; }
  .ch-banner .stats { gap: 8px !important; font-size: 12px !important; }
  .ch-banner .stats span { padding: 2px 7px !important; }

  /* ----- 题目卡片 ----- */
  .q-card {
    padding: 10px 12px !important;
    margin-bottom: 8px !important;
    border-radius: 6px !important;
  }
  .q-no { font-size: 11px !important; padding: 1px 6px !important; }
  .q-no .q-seq { font-size: 10px !important; padding: 1px 5px !important; }
  .q-card .q-stem { font-size: 14px !important; line-height: 1.6 !important; }
  .q-opt {
    padding: 5px 10px !important;
    font-size: 13.5px !important;
    line-height: 1.5 !important;
    margin: 2px 0 !important;
  }
  .q-opt .ol { min-width: 18px !important; }

  /* ----- 题干/选项翻译 ----- */
  .stem-cn {
    font-size: 12.5px !important;
    padding: 5px 8px !important;
    margin: 4px 0 6px !important;
  }
  .opt-cn { font-size: 11.5px !important; }

  /* ----- 题卡按钮 ----- */
  .q-actions { gap: 4px !important; margin-top: 8px !important; padding-top: 6px !important; }
  .q-actions .ans-bar { font-size: 13px !important; padding: 3px 8px !important; }
  .q-actions .ans-bar b { font-size: 14px !important; }

function esc(s){ return s==null?"":s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function highlight(text){
  if(!state.search) return esc(text);

  if(!s) return esc(text);
  var re = new RegExp("(" + s.replace(/[.*+?^${}()|[\]\\/]/g, "\$&") + ")", "ig");
  return esc(text).replace(re, '<mark>$1</mark>');
}

function getCurrentQuestions(){
  if(state.tab === "random"){
    if(state.randomList.length === 0) return [];
    return state.randomList.map(function(i){return QUESTIONS[i];});
  }
  if(state.search){
    var s = state.search.toLowerCase();
    return QUESTIONS.filter(function(q){
      if(String(q.no) === s) return true;
      if(q.stem.toLowerCase().indexOf(s) >= 0) return true;
      for(var k in q.opts){ if(q.opts[k] && q.opts[k].toLowerCase().indexOf(s) >= 0) return true; }
      return false;
    });
  }
  if(state.kp && state.kp !== "__all__"){
    var ids = KP_TO_QS[state.kp] || [];
    return ids.map(function(qid){ return QUESTIONS[QIDS[qid]]; });
  }
  if(state.tab.startsWith("ch")){
    var ch = parseInt(state.tab.slice(2));
    return QUESTIONS.filter(function(q){return q.ch === ch;});
  }
  return QUESTIONS;
}

var VL = {
  list: [],        // 当前显示的题目列表（逻辑顺序）
  heights: [],     // 每张卡片实测高度（未测量为 0，用 estimated）
  pool: [],        // DOM 卡片池（固定 N 个元素）
  poolSize: 16,    // 池子大小（可见+缓冲区）
  estimated: 200,  // 未测量卡片的估算高度
  gap: 12,         // 卡片间距
  rafPending: false,
  preheating: false,
  preheated: false
};

function vlInit(){
  var qList = document.getElementById("qList");
  qList.innerHTML = '<div id="vlBannerSlot"></div><div id="vlViewport"></div>';
  VL.pool = [];
  var vp = document.getElementById("vlViewport");
  for(var i=0; i<VL.poolSize; i++){
    var card = document.createElement("div");
    card.className = "q-card-wrap";
    card.style.display = "none";
    vp.appendChild(card);
    VL.pool.push(card);
  }
  document.getElementById("right").addEventListener("scroll", vlScheduleRender);
  window.addEventListener("resize", vlScheduleRender);
}

/* 后台批量测量所有卡片真实高度，滚动时不再因高度变化而跳变 */
function vlPreheat(){
  if(!VL.list.length || VL.preheating || VL.preheated) return;
  VL.preheating = true;
  var measurer = document.createElement("div");
  measurer.style.cssText = "position:fixed;left:-99999px;top:-99999px;width:920px;visibility:hidden;pointer-events:none;";
  document.body.appendChild(measurer);
  var sum = 0, count = 0, i = 0, n = VL.list.length, batch = 15;
  function processBatch(){
    var end = Math.min(i + batch, n);
    for(; i < end; i++){
      var div = document.createElement("div");
      div.style.cssText = "margin-bottom:12px;";
      div.innerHTML = renderQuestionCard(VL.list[i], {idx: i+1, total: VL.list.length});
      measurer.appendChild(div);
      var h = div.firstChild ? div.firstChild.getBoundingClientRect().height : 0;
      if(h > 30){ VL.heights[i] = h; sum += h; count++; }
    }
    if(i < n){ setTimeout(processBatch, 0); }
    else {
      if(count > 0) VL.estimated = Math.max(180, Math.round(sum / count));
      VL.preheated = true; VL.preheating = false;
      if(measurer.parentNode) measurer.parentNode.removeChild(measurer);
      vlRenderVisible();
    }
  }
  processBatch();
}

function vlMeasureCard(card){
  // 测量内部 .q-card 的高度（不含间距）
  var inner = card.firstChild;
  var h = inner ? inner.getBoundingClientRect().height : 0;
  return h > 30 ? h : VL.estimated;
}

function vlOffsetFor(idx){
  var off = 0;
  for(var i=0; i<idx; i++) off += (VL.heights[i] || VL.estimated) + VL.gap;
  return off;
}

function vlTotal(){
  var s = 0;
  for(var i=0; i<VL.heights.length; i++) s += (VL.heights[i] || VL.estimated);
  return s + (VL.heights.length ? (VL.heights.length - 1) * VL.gap : 0);
}

function vlTopIndex(y){
  var acc = 0;
  for(var i=0; i<VL.heights.length; i++){
    var h = (VL.heights[i] || VL.estimated) + VL.gap;
    if(acc + h > y) return i;
    acc += h;
  }
  return Math.max(0, VL.heights.length - 1);
}

function vlScheduleRender(){
  if(VL.rafPending) return;
  VL.rafPending = true;
  requestAnimationFrame(function(){
    VL.rafPending = false;
    vlRenderVisible();
  });
}

function vlRenderVisible(){
  if(!VL.list.length || !VL.pool.length) return;
  var right = document.getElementById("right");
  var scrollTop = right.scrollTop;
  var viewportH = right.clientHeight;
  var bannerH = document.getElementById("vlBannerSlot").offsetHeight || 0;
  var y0 = Math.max(0, scrollTop - bannerH);
  var y1 = scrollTop + viewportH - bannerH;

  // 回填当前已渲染卡片的实测高度
  for(var i=0; i<VL.pool.length; i++){
    var card = VL.pool[i];
    var idx = parseInt(card.dataset.qIdx || "-1");
    if(idx >= 0 && idx < VL.heights.length){
      VL.heights[idx] = vlMeasureCard(card);
    }
  }

  // 计算可见区间
  var top = vlTopIndex(y0);
  var acc = vlOffsetFor(top), visible = 0;
  for(var j=top; j<VL.list.length; j++){
    if(acc > y1) break;
    acc += (VL.heights[j] || VL.estimated) + VL.gap;
    visible++;
  }
  var start = Math.max(0, top - 2);
  var end = Math.min(VL.list.length, top + visible + 2);

  // 撑开总高度（只改高度，不触发卡片位移）
  document.getElementById("vlViewport").style.height = vlTotal() + "px";

  // 装填池子，用 transform 定位（compositor 层，不 reflow）
  for(var i=0; i<VL.pool.length; i++){
    var card = VL.pool[i];
    var listIdx = start + i;
    if(listIdx < end){
      if(card.dataset.qIdx !== String(listIdx)){
        card.innerHTML = renderQuestionCard(VL.list[listIdx], {idx: listIdx+1, total: VL.list.length});
        card.dataset.qIdx = String(listIdx);
      }
      card.style.transform = "translateY(" + vlOffsetFor(listIdx) + "px)";
      card.style.display = "";
    } else {
      card.dataset.qIdx = "-1";
      card.style.display = "none";
    }
  }

  // 【修复选择选项时跳动】填充后立即测量新卡片高度（答案条显隐会改变高度），若有变化则同步重新定位
  var hChanged = false;
  for(var i=0; i<VL.pool.length; i++){
    var c = VL.pool[i];
    var ci = parseInt(c.dataset.qIdx || "-1");
    if(ci >= 0 && ci < VL.heights.length){
      var mh = vlMeasureCard(c);
      if(Math.abs((VL.heights[ci] || 0) - mh) > 1){
        VL.heights[ci] = mh;
        hChanged = true;
      }
    }
  }
  if(hChanged){
    document.getElementById("vlViewport").style.height = vlTotal() + "px";
    for(var i=0; i<VL.pool.length; i++){
      var c2 = VL.pool[i];
      var ci2 = parseInt(c2.dataset.qIdx || "-1");
      if(ci2 >= 0){
        c2.style.transform = "translateY(" + vlOffsetFor(ci2) + "px)";
      }
    }
  }
}

function vlReset(list, keepHeights){
  VL.list = list;
  if(!keepHeights){
    // 列表变化：重置高度缓存并重新预热测量
    VL.heights = new Array(list.length);
    for(var i=0; i<list.length; i++) VL.heights[i] = 0;
    VL.preheated = false;
    VL.preheating = false;
  }
  for(var i=0; i<VL.pool.length; i++){
    VL.pool[i].innerHTML = "";
    VL.pool[i].dataset.qIdx = "-1";
    VL.pool[i].style.display = "none";
  }
  // 注意：不在这里把 vlViewport 高度清零，否则 vlRenderVisible 测量时 reflow 会把 scrollTop 归零导致页面跳回顶部
  if(!keepHeights){
    setTimeout(vlPreheat, 0);
  }
}

function renderQuestions(keepScroll){
  var list = getCurrentQuestions();

// 性能优化：预编译正则，避免重复创建
var WORD_RE = /[A-Za-z]+(?:['\u2019-][A-Za-z]+)*/g;
function wrapWords(text){
  WORD_RE.lastIndex = 0;
  return text.replace(WORD_RE, function(m){
    var core = m.toLowerCase();
    var isHl = (wordHL[core] !== undefined) ? wordHL[core] : HARD.has(core);
    return '<span class="word'+(isHl?" hl":"")+'" data-w="'+core+'">'+m+'</span>';
  });
}
function renderQuestionCard(q, pos){
  var qid = "q" + q.ch + "_" + q.no;
  var isRevealed = state.showAnswers[qid];
  var qex = (typeof QEXPL !== "undefined" ? QEXPL[qid] : null) || {};
  var note = state.notes[qid] || {};
  // 筛选内序号：仅在知识点筛选/搜索/随机练习时显示（章节视图下与 no 编号重合，不重复显示）
  var seqHtml = "";
  var isFiltered = (state.kp && state.kp !== "__all__") || state.search || state.tab === "random";
  if(pos && pos.total && isFiltered){
    seqHtml = '<span class="q-seq">筛选内 '+pos.idx+'/'+pos.total+'</span>';
  }
  var optStr = "";
  ["A","B","C","D","E","F","G","H"].forEach(function(k){
    if(!q.opts[k]) return;
    var cls = "q-opt";
    if(isRevealed && q.ans === k) cls += " correct";
    else if(state.marked[qid] === k) cls += " mark";
    var optCn = (qex && qex.opts && qex.opts[k]) ? '<span class="opt-cn">'+esc(qex.opts[k])+'</span>' : '';
    optStr += '<li class="'+cls+'" data-qid="'+qid+'" data-k="'+k+'"><span class="ol">'+k+'.</span><span>'+wrapWords(esc(q.opts[k]))+'</span>'+optCn+'</li>';
  });
  var tags = '<span class="q-tag ch" data-kp="__ch'+q.ch+'">第'+(q.ch+1)+'章</span>';
  // 性能优化：使用预构建的 QID_TO_KPS 反向索引，O(1) 查找
  var qkps = QID_TO_KPS[qid] || [];
  qkps.forEach(function(kp){
    tags += '<span class="q-tag kp'+(state.kp===kp.id?" active":"")+'" data-kp="'+kp.id+'" title="'+esc(kp.desc||"")+'">'+esc(kp.name_zh)+'</span>';
  });
  var stemCn = (qex && qex.cn) ? '<div class="stem-cn"><b>翻译：</b>'+esc(qex.cn)+'</div>' : '';
  var hasNote = !!(note.analysis || note.correction);
  var noteOpen = state.openNotes[qid] ? " open" : "";
  var html = '<div class="q-card" data-qid="'+qid+'">';
  html += '<div class="q-no">'+seqHtml+'第 '+q.no+' 题 · '+esc(q.ch_title)+' · P'+q.page+'</div>';
  html += '<div class="q-stem">'+wrapWords(esc(q.stem))+'</div>'+stemCn;
  html += '<ul class="q-opts">'+optStr+'</ul>';
  html += '<div class="q-actions">';
  html += '<div class="ans-bar'+(isRevealed?'':' hidden')+'" data-qid="'+qid+'" data-act="toggle">正确答案：<b>'+esc(q.ans)+'. '+esc(q.opts[q.ans]||"")+'</b></div>';
  html += '<button class="act-btn'+(isRevealed?' on':'')+'" data-qid="'+qid+'" data-act="toggle">'+(isRevealed?'🙈 隐藏':'👁 显示')+'答案</button>';
  html += '<button class="act-btn q-act-note'+(hasNote?' has-content':'')+'" data-qid="'+qid+'" data-act="note">📝 教师备注</button>';
  html += '</div>';
  html += '<div class="q-notes'+noteOpen+'" data-qid="'+qid+'">';
  html += '<div class="note-label">📝 题目解析（讲题时填写）</div>';
  html += '<textarea data-field="analysis" data-qid="'+qid+'" placeholder="例如：本题考察 GMDSS 定义中的卫星系统组成部分...">'+esc(note.analysis||"")+'</textarea>';
  html += '<div class="note-label" style="margin-top:10px">✏️ 订正批注（题目有问题时填写）</div>';
  html += '<textarea data-field="correction" data-qid="'+qid+'" placeholder="例如：选项 C 的表述不准确，应改为...">'+esc(note.correction||"")+'</textarea>';
  html += '<div class="save-hint">输入后自动保存到本地浏览器</div>';
  html += '</div>';
  html += '<div class="q-tags">'+tags+'</div>';
  html += '</div>';
  return html;
}

function pickRandom(){
  var n = 20, byCh = {};
  QUESTIONS.forEach(function(q,i){ if(!byCh[q.ch]) byCh[q.ch]=[]; byCh[q.ch].push(i); });
  var keys = Object.keys(byCh);
  keys.forEach(function(k){ for(var i=byCh[k].length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=byCh[k][i]; byCh[k][i]=byCh[k][j]; byCh[k][j]=t; } });
  var perCh = Math.ceil(n/keys.length), result = [];
  keys.forEach(function(k){ result = result.concat(byCh[k].slice(0,perCh)); });
  if(result.length > n){ for(var i=result.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=result[i]; result[i]=result[j]; result[j]=t; } result = result.slice(0, n); }
  return result;
}

function showToast(msg, duration){

document.getElementById("btnExport").onclick = function(){

    return;
  }
  var data = {
    type: "gmdss_teacher_notes",
    version: 1,
    exportedAt: new Date().toISOString(),
    totalQuestions: QUESTIONS.length,
    noteCount: n,
    notes: state.notes
  };
  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], { type: "application/json;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var d = new Date();
  var pad = function(x){ return x < 10 ? "0"+x : ""+x; };
  var fname = "GMDSS教师备注_" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + ".json";
  a.href = url; a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showToast("✅ 已导出 " + n + " 条备注 → " + fname);
};

document.getElementById("importFile").addEventListener("change", function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try {
      var data = JSON.parse(ev.target.result);
      if(!data || data.type !== "gmdss_teacher_notes" || !data.notes){
        showToast("❌ 不是有效的备注文件");
        return;
      }
      showImportDialog(data, file.name);
    } catch(err) {
      showToast("❌ 文件解析失败: " + err.message);
    }
    e.target.value = ""; // 重置以便下次能选同一个文件
  };
  reader.onerror = function(){ showToast("❌ 读取文件失败"); };
  reader.readAsText(file, "utf-8");
});

function showImportDialog(data, fileName){
  var existing = state.notes;
  var imported = data.notes || {};
  var newCount = 0, overlapCount = 0;
  Object.keys(imported).forEach(function(qid){
    if(existing[qid] && (existing[qid].analysis || existing[qid].correction)){
      overlapCount++;
    } else {
      newCount++;
    }
  });
  var html = '<div class="id-head"><span class="t">📥 导入教师备注</span><button id="idClose">×</button></div>';
  html += '<div class="id-body">';
  html += '<div>文件：<b>' + esc(fileName) + '</b></div>';
  html += '<div>导出时间：' + esc((data.exportedAt||"").substring(0,19).replace("T"," ")) + '</div>';
  html += '<div class="stat">文件中包含 <b>' + Object.keys(imported).length + '</b> 条备注</div>';
  if(overlapCount > 0){
    html += '<div class="stat overlap">⚠️ 其中 <b>' + overlapCount + '</b> 条与现有备注冲突，覆盖后将丢失现有内容</div>';
  }
  html += '<div class="stat">当前浏览器内已有 <b>' + notesCount() + '</b> 条备注</div>';
  html += '<div style="margin-top:10px;color:#57606a">请选择导入策略：</div>';
  html += '</div>';
  html += '<div class="id-actions">';
  html += '<button id="idCancel">取消</button>';
  if(overlapCount > 0){
    html += '<button id="idMerge" class="primary">合并（保留现有，仅添加新）</button>';
    html += '<button id="idOverwrite" class="danger">覆盖（推荐从旧电脑导入时使用）</button>';
  } else {
    html += '<button id="idMerge" class="primary">全部导入</button>';
  }
  html += '</div>';

  var dlg = document.createElement("div");
  dlg.id = "impDialog";
  dlg.innerHTML = html;
  document.body.appendChild(dlg);

  function closeDlg(){ document.body.removeChild(dlg); }

  document.getElementById("idClose").onclick = closeDlg;
  document.getElementById("idCancel").onclick = closeDlg;

  document.getElementById("idMerge").onclick = function(){
    // 合并：仅添加不冲突的条目
    var added = 0;
    Object.keys(imported).forEach(function(qid){
      if(!state.notes[qid] || (!state.notes[qid].analysis && !state.notes[qid].correction)){
        state.notes[qid] = imported[qid];
        added++;
      }
    });
    saveNotes();
    saveNotesNow();
    closeDlg();
    showToast("✅ 合并完成，新增 " + added + " 条备注");
    renderQuestions(true);
  };

  document.getElementById("idOverwrite").onclick = function(){
    // 覆盖：用导入的数据替换 state.notes
    state.notes = imported;
    saveNotes();
    saveNotesNow();
    closeDlg();
    showToast("✅ 覆盖完成，当前共 " + notesCount() + " 条备注");
    renderQuestions(true);
  };
}

    e.stopPropagation();
    if (window.innerWidth > 768) return;
    if (left.classList.contains('hidden-nav')) {
      left.classList.remove('hidden-nav');
      document.body.classList.add('nav-open');
      btnToggle.textContent = '✕ 关闭';
    } else {
      left.classList.add('hidden-nav');
      document.body.classList.remove('nav-open');
      btnToggle.textContent = '📂 导航';
    }
  });

  // 遮罩点击关闭（点击 #right 或其他区域）
  document.body.addEventListener('click', function(e){
    if (!document.body.classList.contains('nav-open')) return;
    if (!left.contains(e.target) && e.target !== btnToggle && !btnToggle.contains(e.target)) {
      left.classList.add('hidden-nav');
      document.body.classList.remove('nav-open');
      btnToggle.textContent = '📂 导航';
    }
  });

  // 点击左侧导航项后自动收起（仅移动端）
  left.addEventListener('click', function(e){
    if (window.innerWidth <= 768) {
      if (e.target.closest('.kp') || e.target.closest('.ch-all')) {
        left.classList.add('hidden-nav');
        document.body.classList.remove('nav-open');
        btnToggle.textContent = '📂 导航';
      }
    }
  });
})();

}catch(e){
  
  var errBox = document.createElement('div');
  errBox.style.cssText = 'position:fixed;top:80px;left:20px;right:20px;background:#fee;border:2px solid #c00;padding:15px;z-index:9999;font-family:monospace;font-size:13px;color:#900;white-space:pre-wrap;max-height:80vh;overflow:auto;border-radius:6px;';
  errBox.innerHTML = '<b>页面初始化错误：</b>\n' + (e.message + '\n\n' + e.stack).replace(/</g, '<');
  document.body.appendChild(errBox);
}
</script>
</body>
</html>
