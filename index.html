<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#154360">
<title>GMDSS · 整合讲评</title>
<style>
* { margin:0; padding:0; box-sizing:border-box }
html, body { height:100%; font-family:"Microsoft YaHei","Inter",Arial,sans-serif; background:#f0f1f3; color:#1f2328 }
body { display:flex; flex-direction:column; overflow:hidden }

/* 顶部导航：单行紧凑栏（标题 + tabs + 统计按钮） */
header {
  background:#154360; color:#fff; padding:6px 16px;
  display:flex; align-items:center; gap:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.15); flex-shrink:0;
  position:relative;
}
.brand h1 { font-size:16px; letter-spacing:1px; font-weight:700; white-space:nowrap }
header .spacer { flex:1 }

/* tabs：嵌入顶栏的胶囊按钮 */
#tabs { display:flex; gap:6px; background:transparent; padding:0 }
#tabs button {
  border:none; background:rgba(255,255,255,.08); color:#e6edf4;
  padding:7px 16px; font-size:13px; cursor:pointer;
  font-weight:500; border-radius:6px; white-space:nowrap;
}
#tabs button:hover { background:rgba(255,255,255,.16); color:#fff }
#tabs button.active { background:#f0f1f3; color:#154360; font-weight:700 }
#tabs button .cnt { font-size:11px; opacity:.7; font-weight:400; margin-left:5px }

/* 统计按钮（桌面端也显示，点击弹出题量统计） */
#menuToggle {
  display:flex; align-items:center; justify-content:center;
  width:32px; height:32px; background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:6px;
  cursor:pointer; font-size:16px; flex-shrink:0;
}
#menuToggle:hover { background:rgba(255,255,255,.22) }
#statsPanel {
  display:none; position:absolute; top:calc(100% + 4px); right:12px;
  background:#1a5276; color:#fff; border-radius:8px; padding:10px 16px;
  font-size:13px; box-shadow:0 4px 16px rgba(0,0,0,.3); z-index:100;
  min-width:230px;
}
#statsPanel.show { display:block }
#statsPanel .stat-row { display:flex; justify-content:space-around; text-align:center }
#statsPanel .stat-item { flex:1; padding:4px 8px }
#statsPanel .stat-item b { display:block; color:#D4AF37; font-size:18px; font-weight:700; margin-bottom:2px }

/* iframe 区 */
#stage {
  flex:1; background:#fff; position:relative;
}
iframe {
  position:absolute; inset:0; width:100%; height:100%; border:0;
  background:#fff; display:none;
}
iframe.active { display:block }

/* footer（瘦身） */
footer {
  background:#fff; border-top:1px solid #c9ced4; padding:4px 16px;
  font-size:10px; color:#7f8c8d; text-align:center; flex-shrink:0;
}

/* 提示条：桌面端默认隐藏（移动端可展开） */
#hint {
  display:none;
  background:#fff8e1; color:#7a5b00;
  border-bottom:1px solid #e6c96b;
}
#hint b { color:#c05621 }

/* ===========================================
   📱 移动端响应式优化 (≤768px)
   =========================================== */
@media (max-width: 768px) {

  /* ----- 顶部 Header：标题行 + tabs 另起一行 ----- */
  header {
    padding: 8px 12px;
    gap: 8px;
    min-height: 44px;
    flex-wrap: wrap;
    row-gap: 6px;
  }
  .brand h1 {
    font-size: 15px;
    letter-spacing: 0.5px;
    line-height: 1.2;
  }
  header .spacer { order: 2; }
  #menuToggle { order: 3; }

  /* ----- 移动端统计按钮微调 ----- */
  #menuToggle { width:36px; height:36px; font-size:18px; }
  #menuToggle:active { background: rgba(255,255,255,0.25); }

  /* 弹出统计信息：移动端左右撑满 */
  #statsPanel {
    left: 8px;
    right: 8px;
    top: 100%;
    margin-top: 4px;
  }

  /* ----- Tabs：移动端另起一行横向滚动 ----- */
  #tabs {
    order: 4;
    flex: 1 1 100%;
    padding: 0;
    gap: 4px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    flex-shrink: 0;
    background: transparent;
  }
  #tabs::-webkit-scrollbar { display: none; }

  #tabs button {
    padding: 8px 14px;
    font-size: 13px;
    min-height: 40px;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    white-space: nowrap;
    border-radius: 6px;
  }
  #tabs button .cnt {
    font-size: 11px;
    margin: 0 0 0 6px;
    padding: 1px 6px;
    background: rgba(255,255,255,0.12);
    border-radius: 8px;
    opacity: 1;
    font-weight: 400;
  }
  #tabs button.active .cnt { background: rgba(21,67,96,0.12); }

  /* ----- 提示条：移动端可展开查看 ----- */
  #hint {
    display: block;
    padding: 4px 12px;
    font-size: 11px;
  }
  #hint.collapsed { display: none; }
  #hintToggle {
    display: inline-block;
    background: #fff8e1;
    border: 1px solid #e6c96b;
    color: #7a5b00;
    border-radius: 4px;
    padding: 2px 8px;
    margin-left: 6px;
    font-size: 11px;
    cursor: pointer;
    vertical-align: middle;
  }

  /* ----- Footer 紧凑 ----- */
  footer {
    padding: 4px 12px;
    font-size: 10px;
  }

  /* ----- iframe 高度自适应 ----- */
  #stage {
    flex: 1;
    min-height: 0;
  }

  /* ----- 提高可点击区域 ----- */
  #tabs button, #menuToggle, #hintToggle {
    -webkit-tap-highlight-color: rgba(212,175,55,0.3);
  }
}

/* ===== 更小屏幕（手机竖屏，≤480px） ===== */
@media (max-width: 480px) {
  header { padding: 6px 10px; }
  .brand h1 { font-size: 14px; }
  #tabs button {
    padding: 6px 10px;
    font-size: 12px;
    min-height: 36px;
  }
  #tabs button .cnt { font-size: 10px; padding: 0 5px; }
}

/* ===== hint 展开按钮默认隐藏（移动端提示条内使用） ===== */
#hintToggle { display: none; }
</style>
</head>
<body>

<header>
  <div class="brand"><h1>GMDSS · 整合讲评</h1></div>
  <nav id="tabs">
    <button data-tab="kb" class="active">📚 知识题库<span class="cnt">827题</span></button>
    <button data-tab="oral">🎙 听力与会话<span class="cnt">47+84</span></button>
    <button data-tab="handbook">📖 速查手册<span class="cnt">6章</span></button>
  </nav>
  <div class="spacer"></div>
  <button id="menuToggle" aria-label="统计信息">📊</button>
  <div id="statsPanel">
    <div class="stat-row">
      <div class="stat-item"><b>84</b>问答题</div>
      <div class="stat-item"><b>47</b>口述题</div>
    </div>
    <div class="stat-row" style="margin-top:6px">
      <div class="stat-item"><b>200</b>信号题</div>
      <div class="stat-item"><b>827</b>知识题</div>
    </div>
  </div>
</header>

<div id="hint" class="collapsed">
  <b>提示:</b>点上方 tab 切换内容。
  <button id="hintToggle" onclick="document.getElementById('hint').classList.remove('collapsed');this.style.display='none'">展开</button>
</div>

<div id="stage">
  <iframe id="frame-kb"   src="GMDSS英语阅读_知识点题库.html"   class="active"></iframe>
  <iframe id="frame-oral" src="app.html"></iframe>
  <iframe id="frame-handbook" src="handbook.html"></iframe>
</div>

<footer>
  GMDSS · 整合讲评 v1.0  ·  内部使用
</footer>

<script>
const tabs = document.querySelectorAll('#tabs button');
const frames = {
  kb:   document.getElementById('frame-kb'),
  oral: document.getElementById('frame-oral'),
  handbook: document.getElementById('frame-handbook'),
};

tabs.forEach(btn => {
  btn.addEventListener('click', () => {
    tabs.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    Object.values(frames).forEach(f => f.classList.remove('active'));
    frames[btn.dataset.tab].classList.add('active');
    // 切换 tab 时自动收起移动端的提示条
    const hint = document.getElementById('hint');
    if (hint) hint.classList.add('collapsed');
  });
});

// 移动端：点击 📊 按钮切换统计信息面板
const menuToggle = document.getElementById('menuToggle');
const statsPanel = document.getElementById('statsPanel');
if (menuToggle && statsPanel) {
  menuToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    statsPanel.classList.toggle('show');
  });
  // 点击外部关闭
  document.addEventListener('click', (e) => {
    if (!statsPanel.contains(e.target) && e.target !== menuToggle) {
      statsPanel.classList.remove('show');
    }
  });
}
</script>

</body>
</html>
